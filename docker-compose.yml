services:
  postgres:
    image: postgres:16-alpine
    container_name: devsecops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devsecops
      POSTGRES_PASSWORD: devsecops
      POSTGRES_DB: devsecops
    ports:
      - "${POSTGRES_HOST_PORT:-5544}:5432"
    volumes:
      - devsecops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsecops -d devsecops"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devsecops-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6399}:6379"
    volumes:
      - devsecops_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["container-app"]
    # Set PIP_TRUSTED_HOSTS only for a workstation whose Docker proxy CA is
    # not installed. Production builds use normal certificate validation.
    build:
      context: .
      args:
        PIP_TRUSTED_HOSTS: ${PIP_TRUSTED_HOSTS:-}
    container_name: devsecops-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://devsecops:devsecops@postgres:5432/devsecops
      REDIS_URL: redis://redis:6379/0
      EXECUTOR_SERVICE_KEY: ${EXECUTOR_SERVICE_KEY:-dev-executor-key}
      # Bootstrap-only for empty users table; login always checks hashed password in DB.
      AUTH_USERNAME: ${AUTH_USERNAME:-admin}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-infralens}
      AUTH_DISPLAY_NAME: ${AUTH_DISPLAY_NAME:-Admin}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      # Agent runtime + on-prem n8n (n8n is part of container-app stack)
      ARCHITECT_LANGGRAPH: ${ARCHITECT_LANGGRAPH:-false}
      DEBUG_REACT_ENABLED: ${DEBUG_REACT_ENABLED:-false}
      CHAT_LANGGRAPH: ${CHAT_LANGGRAPH:-false}
      N8N_WEBHOOKS_ENABLED: ${N8N_WEBHOOKS_ENABLED:-true}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/infralens}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      INTEGRATIONS_API_KEY: ${INTEGRATIONS_API_KEY:-}
      INTEGRATIONS_API_ROLE: ${INTEGRATIONS_API_ROLE:-devops_lead}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    profiles: ["container-app"]
    build:
      context: .
      args:
        PIP_TRUSTED_HOSTS: ${PIP_TRUSTED_HOSTS:-}
    container_name: devsecops-worker
    restart: unless-stopped
    command: rq worker intelligence --worker-class app.intelligence.worker.Worker --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg2://devsecops:devsecops@postgres:5432/devsecops
      REDIS_URL: redis://redis:6379/0
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET in .env}
      ARCHITECT_LANGGRAPH: ${ARCHITECT_LANGGRAPH:-false}
      DEBUG_REACT_ENABLED: ${DEBUG_REACT_ENABLED:-false}
      N8N_WEBHOOKS_ENABLED: ${N8N_WEBHOOKS_ENABLED:-true}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/infralens}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      LANGFUSE_TRACING_ENABLED: ${LANGFUSE_TRACING_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # On-prem n8n is mandatory for our server (container-app profile).
  # Forks: docker compose -f docker-compose.yml -f docker-compose.without-n8n.yml --profile container-app up -d
  n8n:
    profiles: ["container-app"]
    image: n8nio/n8n:1.82.3
    container_name: devsecops-n8n
    restart: unless-stopped
    ports:
      - "${N8N_HOST_PORT:-5678}:5678"
    environment:
      N8N_HOST: ${N8N_HOST:-0.0.0.0}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678/}
      WEBHOOK_URL: ${N8N_PUBLIC_WEBHOOK_URL:-http://127.0.0.1:5678/}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      TZ: ${GENERIC_TIMEZONE:-Asia/Kolkata}
      # Do not use ${VAR:?} — Compose interpolates all services and broke deploy when .env lacked the key.
      # Prefer a real key in .env; gha-deploy.sh auto-generates one when missing.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-infralens-onprem-n8n-change-me}
      # false until TLS is terminated in front of n8n (HTTP host:port access).
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:5678/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  azure-executor:
    profiles: ["container-app"]
    build:
      context: .
      dockerfile: executors/azure/Dockerfile
      args:
        PIP_TRUSTED_HOSTS: ${PIP_TRUSTED_HOSTS:-}
    container_name: devsecops-azure-executor
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://api:8000
      EXECUTOR_SERVICE_KEY: dev-executor-key
      EXECUTOR_PROVIDER: azure
      EXECUTOR_ORG_ID: ${EXECUTOR_ORG_ID:-00000000-0000-4000-8000-000000000001}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  aws-executor:
    profiles: ["container-app"]
    build:
      context: .
      dockerfile: executors/aws/Dockerfile
      args:
        PIP_TRUSTED_HOSTS: ${PIP_TRUSTED_HOSTS:-}
    container_name: devsecops-aws-executor
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://api:8000
      EXECUTOR_SERVICE_KEY: dev-executor-key
      EXECUTOR_PROVIDER: aws
      EXECUTOR_ORG_ID: ${EXECUTOR_ORG_ID:-00000000-0000-4000-8000-000000000001}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

  github-executor:
    profiles: ["container-app"]
    build:
      context: .
      dockerfile: executors/github/Dockerfile
      args:
        PIP_TRUSTED_HOSTS: ${PIP_TRUSTED_HOSTS:-}
    container_name: devsecops-github-executor
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
      CONTROL_PLANE_URL: http://api:8000
      EXECUTOR_SERVICE_KEY: dev-executor-key
      EXECUTOR_PROVIDER: github
      EXECUTOR_ORG_ID: ${EXECUTOR_ORG_ID:-00000000-0000-4000-8000-000000000001}
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  devsecops_pgdata:
  devsecops_redisdata:
  n8n_data:
