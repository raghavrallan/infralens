name: Quality

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-onprem:
    name: Compose On-Prem (n8n required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate container-app includes n8n (mandatory on-prem)
        env:
          AUTH_JWT_SECRET: ci-jwt-secret-not-for-production
          N8N_ENCRYPTION_KEY: ci-n8n-encryption-key-32chars!!
        run: |
          set -euo pipefail
          docker compose --profile container-app config > /tmp/compose.yml
          docker compose --profile container-app config --services | tee /tmp/services.txt
          grep -qx n8n /tmp/services.txt
          grep -qx api /tmp/services.txt
          grep -qx worker /tmp/services.txt
          grep -q 'N8N_WEBHOOKS_ENABLED' /tmp/compose.yml
          grep -q 'n8nio/n8n' /tmp/compose.yml
          # Must not use required-interpolation (?:/??); it broke server deploy when .env lacked the key.
          # Match only ${N8N_ENCRYPTION_KEY:?...} / ${N8N_ENCRYPTION_KEY??...} — not the safe ${VAR:-default} form.
          if grep -qF '${N8N_ENCRYPTION_KEY:?' docker-compose.yml \
            || grep -qF '${N8N_ENCRYPTION_KEY??' docker-compose.yml; then
            echo "ERROR: N8N_ENCRYPTION_KEY must not use required (? ) interpolation" >&2
            exit 1
          fi
          grep -qF '${N8N_ENCRYPTION_KEY:-' docker-compose.yml
          echo "On-prem compose OK (n8n mandatory in container-app)"
      - name: Validate without-n8n override disables webhook defaults
        env:
          AUTH_JWT_SECRET: ci-jwt-secret-not-for-production
          N8N_ENCRYPTION_KEY: ci-n8n-encryption-key-32chars!!
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f docker-compose.without-n8n.yml --profile container-app config > /tmp/optional.yml
          grep -q 'N8N_WEBHOOKS_ENABLED' /tmp/optional.yml
          echo "Optional without-n8n override parses OK"

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck

  agent-runtime:
    name: Agent Runtime Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_JWT_SECRET: test-jwt-secret-not-for-production
      LANGFUSE_TRACING_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run agent runtime / LangGraph / webhook tests
        run: |
          pytest tests/test_agent_runtime.py tests/unit/agents -vv --tb=short \
            --junitxml=junit-agent-runtime.xml
      - name: Upload agent runtime JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-agent-runtime
          path: junit-agent-runtime.xml

  pylint:
    name: Pylint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run Pylint (fail under 9.0)
        run: |
          set -o pipefail
          pylint app executors --output-format=parseable | tee pylint.txt
      - name: Upload Pylint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: pylint.txt

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devsecops
          POSTGRES_PASSWORD: devsecops
          POSTGRES_DB: devsecops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsecops -d devsecops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://devsecops:devsecops@localhost:5432/devsecops_test
      AUTH_JWT_SECRET: test-jwt-secret-not-for-production
      EXECUTOR_SERVICE_KEY: test-executor-key
      LANGFUSE_TRACING_ENABLED: "false"
      AUTH_VERIFY_DB: "false"
      CI: "true"
      RUN_INFRA_TESTS: ${{ secrets.RUN_INFRA_TESTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        run: |
          FAIL_UNDER=0
          pytest tests/unit tests/test_agent_runtime.py -vv --tb=short \
            --cov=app --cov=executors --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-fail-under="${FAIL_UNDER}" \
            --junitxml=junit-unit.xml
      - name: Publish unit summary
        if: always()
        run: >
          python scripts/github_pytest_summary.py
          --title "Unit tests"
          --junit junit-unit.xml
          --coverage coverage-unit.xml
          --note "DB/Redis tests run only when RUN_INFRA_TESTS=true. Unit coverage is informational; the 90% gate applies to the full suite when infra tests are on."
      - name: Upload unit JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-unit
          path: |
            junit-unit.xml
            coverage-unit.xml

  integration-coverage:
    name: Integration Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devsecops
          POSTGRES_PASSWORD: devsecops
          POSTGRES_DB: devsecops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devsecops -d devsecops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://devsecops:devsecops@localhost:5432/devsecops_test
      AUTH_JWT_SECRET: test-jwt-secret-not-for-production
      EXECUTOR_SERVICE_KEY: test-executor-key
      LANGFUSE_TRACING_ENABLED: "false"
      AUTH_VERIFY_DB: "false"
      CI: "true"
      RUN_INFRA_TESTS: ${{ secrets.RUN_INFRA_TESTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run full suite with coverage gate
        run: |
          FAIL_UNDER=0
          if [ "${RUN_INFRA_TESTS}" = "true" ]; then
            FAIL_UNDER=90
          fi
          pytest -vv --tb=short \
            --cov=app --cov=executors --cov-branch \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --cov-fail-under="${FAIL_UNDER}" \
            --junitxml=junit.xml
      - name: Publish coverage summary
        if: always()
        run: |
          if [ "${RUN_INFRA_TESTS}" = "true" ]; then
            NOTE="Combined line+branch coverage must be at least 90% (infra tests enabled)."
          else
            NOTE="RUN_INFRA_TESTS is false: Postgres/Redis tests were skipped and the 90% coverage gate is off."
          fi
          python scripts/github_pytest_summary.py \
            --title "Integration tests + coverage" \
            --junit junit.xml \
            --coverage coverage.xml \
            --note "${NOTE}"
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-and-junit
          path: |
            coverage.xml
            htmlcov
            junit.xml

  quality-gate:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs:
      [
        compose-onprem,
        frontend-typecheck,
        agent-runtime,
        pylint,
        unit-tests,
        integration-coverage,
      ]
    if: always()
    steps:
      - name: Enforce all required checks
        run: |
          echo "Compose on-prem: ${{ needs.compose-onprem.result }}"
          echo "Frontend typecheck: ${{ needs.frontend-typecheck.result }}"
          echo "Agent runtime: ${{ needs.agent-runtime.result }}"
          echo "Pylint: ${{ needs.pylint.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integration + coverage: ${{ needs.integration-coverage.result }}"
          if [ "${{ needs.compose-onprem.result }}" != "success" ] || \
             [ "${{ needs.frontend-typecheck.result }}" != "success" ] || \
             [ "${{ needs.agent-runtime.result }}" != "success" ] || \
             [ "${{ needs.pylint.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.integration-coverage.result }}" != "success" ]; then
            echo "Quality gates FAILED — merge blocked"
            exit 1
          fi
          echo "Quality Gates Passed"
