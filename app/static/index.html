<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSecOps Skills Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">DS</div>
          <div>
            <h1>DevSecOps</h1>
            <p>Skills Suite</p>
          </div>
        </div>
        <nav class="nav">
          <a href="/" class="nav-item active">Chat</a>
          <a href="/wiki" class="nav-item">Wiki</a>
          <a href="/settings" class="nav-item">Settings</a>
        </nav>
      </header>

      <div class="workspace">
        <aside class="chat-sidebar">
          <div class="project-bar">
            <span class="project-label">Project</span>
            <div class="project-row">
              <select id="project-select" class="project-select"></select>
              <button id="new-project" class="icon-btn" title="New project">+</button>
            </div>
          </div>
          <button id="new-chat" class="new-chat">+ New chat</button>
          <div class="chat-list scroll" id="chat-list"></div>
        </aside>

        <main class="chat">
          <div class="chat-toolbar">
            <div class="mode-toggle" id="mode-toggle">
              <button class="mode-btn active" data-mode="agent" title="Executes skills">
                Agent
              </button>
              <button class="mode-btn" data-mode="plan" title="Plans only, read-only">
                Plan
              </button>
            </div>
            <div class="toolbar-right">
              <div class="status" id="status">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Checking…</span>
              </div>
              <div class="active-skill" id="active-skill">
                <span class="active-skill-label">Auto · multi-agent</span>
              </div>
            </div>
          </div>

          <div class="messages scroll" id="messages">
            <div class="empty-state" id="empty-state">
              <div class="empty-eyebrow">Secure-by-design delivery</div>
              <h3>What can I help you secure today?</h3>
              <p>
                Let the agent plan a multi-skill task, or type <code>/</code> to
                pick a skill inline.
              </p>
              <div class="suggestions" id="suggestions"></div>
            </div>
          </div>

          <form class="composer" id="composer">
            <div class="slash-menu scroll" id="slash-menu" hidden></div>

            <div class="suggest-bar" id="suggest-bar" hidden>
              <span class="suggest-label">Suggested skill</span>
              <button type="button" class="suggest-pill" id="suggest-pill"></button>
              <span class="suggest-hint">press Tab</span>
            </div>

            <div class="composer-row">
              <textarea
                id="input"
                rows="1"
                placeholder="Describe your task, paste a pipeline / IaC / scan output, or type / to pick a skill…"
              ></textarea>
              <button type="submit" id="send-btn">Send</button>
            </div>

            <div class="composer-controls">
              <label class="control">
                <span>Actions</span>
                <select id="action-scope">
                  <option value="read_only">Read-only actions</option>
                  <option value="write">Write actions</option>
                </select>
              </label>
              <label class="control">
                <span>Access</span>
                <select id="access-level">
                  <option value="ask_approval">Ask for approval</option>
                  <option value="auto_approve">Approve for me</option>
                  <option value="full_access">Full access</option>
                </select>
              </label>
              <span class="composer-hint" id="composer-hint"></span>
            </div>
          </form>
        </main>
      </div>
    </div>

    <script src="/static/modal.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
