[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    unit: isolated tests that do not require PostgreSQL
    integration: tests that require an isolated PostgreSQL database
    e2e: critical-path workflows across API + database
